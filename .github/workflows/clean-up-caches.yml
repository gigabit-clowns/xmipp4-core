name: Clean up caches
permissions: {}

on:
  pull_request:
    types:
      - closed

jobs:
  delete_pull_request_caches:
    name: Delete the caches of a closed pull request
    permissions:
      actions: write
    runs-on: ubuntu-latest
		# Only delete caches for pull requests from the same repository, not from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          ids=$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "No caches for $REF"
            exit 0
          fi

          for id in $ids; do
            gh cache delete "$id"
          done
