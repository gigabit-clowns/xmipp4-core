name: Clean up caches
description: Deletes Actions caches and reports what it recovered.

inputs:
  scope:
    description: Which caches go, "every" or "superseded".
    required: true
  ref:
    description: Ref to restrict to. Every ref when left empty.
    required: false
    default: ""
  token:
    description: Token with write access to actions.
    required: true

runs:
  using: composite
  steps:
    - name: Report what the repository holds
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/caches.sh"

        report_usage "Before"
        echo
        echo "Caches in scope:"
        caches=$(list_caches "$REF")
        tabulate "$caches"
        printf '%s' "$caches" > "$RUNNER_TEMP/caches.json"

    - name: Pick the ones to delete
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        SCOPE: ${{ inputs.scope }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/caches.sh"

        caches=$(cat "$RUNNER_TEMP/caches.json")
        if [ "$SCOPE" = superseded ]; then
          doomed=$(select_superseded "$caches")
        else
          doomed="$caches"
        fi
        printf '%s' "$doomed" > "$RUNNER_TEMP/doomed.json"

        count=$(jq 'length' <<<"$doomed")
        if [ "$count" -eq 0 ]; then
          echo "Nothing to delete."
        else
          echo "Deleting $count:"
          tabulate "$doomed"
        fi

    - name: Delete them
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/caches.sh"

        doomed=$(cat "$RUNNER_TEMP/doomed.json")
        count=$(jq 'length' <<<"$doomed")
        if [ "$count" -eq 0 ]; then
          exit 0
        fi

        for id in $(jq -r '.[].id' <<<"$doomed"); do
          gh cache delete "$id" > /dev/null
        done
        echo "Deleted $count caches, reclaiming $(total_mib "$doomed") MiB."

    - name: Report what is left
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/caches.sh"

        report_usage "After"
        echo
        echo "Caches left in scope:"
        tabulate "$(list_caches "$REF")"
