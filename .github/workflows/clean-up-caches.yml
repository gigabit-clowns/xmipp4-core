name: Clean up caches
permissions: {}

on:
  pull_request:
    types:
      - closed

jobs:
  delete_pull_request_caches:
    name: Delete the caches of a closed pull request
    permissions:
      actions: write
    runs-on: ubuntu-latest
    # A fork's token is read only, so the deletion would fail rather than
    # leave anything behind. Those caches expire on their own after 7 days.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          # The compiler cache saves a new entry on every run, because a
          # cache cannot be overwritten, and a pull request's entries are
          # reachable from its own ref alone. Once it closes they are dead
          # weight against the repository's shared 10 GB.
          ids=$(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "No caches for $REF"
            exit 0
          fi

          for id in $ids; do
            gh cache delete "$id"
          done
